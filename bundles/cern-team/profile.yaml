# Bundle: cern-team
#
# Generic CERN team knowledge instance built from the archi v3
# connectors (W2, req.w2.sources): TWiki (EOS dump only), documentation
# sites, the public CMSSW release catalog, JIRA (cache-backed,
# optional credential), Indico (optional, see
# source-defaults/indico.yaml.example), and GitHub
# and GitLab repositories via the substrate's own git_graph adapter
# (composed by default — see modules.yaml).
#
# Install (the okg profile installer consumes this file):
#
#   export OKG_PROFILES_DIR="$(archi-profiles-dir)"
#   okg install --profile cern-team \
#     --deployment-name <slug> \
#     --postgres-dsn 'postgresql://...'
#
# That is the whole install. It provisions, migrates, materialises this
# bundle's schemas/ (okg#1367), loads the catalog, ingests and publishes.
#
# `--no-publish` is no longer needed. It used to be, because the schema
# slices had to be hand-copied between the scaffold and the catalog load,
# which meant re-doing the rest of the install by hand as well. The
# `schemas:` slot below removed that.
#
# One connector is selected by default — the CMSSW release catalog, which
# needs no credential — so a bare install reaches a published generation on
# its own (ADR 0001 W6: an instance with nothing configured must start
# cleanly). Everything else ships as `.yaml.example` in source-defaults/:
# rename one to `.yaml` to opt in, and supply its credential, cache or URL.
#
# There is no such thing as an installed-but-inactive source. Every source
# the installer writes is selected, and one that cannot read its input fails
# the completeness gate, which blocks the publish for all the others. So a
# source you cannot feed must not be installed at all.

name: cern-team
version: 0.1.0
classification: reusable
description: |
  Generic CERN team knowledge instance. Composes the document/person/
  extraction substrate modules with the archi HEP connectors: TWiki
  EOS-dump reader (the only TWiki path), documentation-site reader,
  CMSSW release catalog (live public fetch),
  cache-backed JIRA, and
  GitHub/GitLab repositories the connectors clone themselves. Indico
  stays an optional add-on an instance enables after install.
  Ships the archi playbooks (skills/) and a core-pages-floor
  invariant. Extracted from the w1-scratch scratch instance proven on
  2026-08-11/12 (pact w2-consolidate-hep-sources).

init_questions:
  - id: deployment_name
    prompt: deployment name (also used as the deployments/<name>/ dir)
    type: slug
    required: true
    description: |
      Slug for the deployment directory and the catalog's
      `deployment_name`. Use lowercase, dashes or underscores.

  - id: postgres_dsn
    prompt: Postgres DSN (postgresql://...)
    type: string
    required: true
    description: |
      Substrate Postgres DSN. The instance owns its own database; do
      not point this at another instance's database. `${OKG_DSN}` is
      accepted verbatim — the manifest DSN resolver interpolates
      `${VAR}` references at command time, so the credential never
      needs to be written to disk.

  - id: archi_data_root
    prompt: data root for connector caches (relative roots resolve
      against ARCHI_DATA_ROOT or the current directory)
    type: string
    required: false
    default: data
    description: |
      Root for the connector cache files (jira/, docsite/,
      cmssw-releases/, twiki-snapshot/ by default). The default `data` is
      relative. The archi cache readers anchor a relative root on
      ARCHI_DATA_ROOT when it is set, but repository checkouts
      (repo_root, `<data root>/repos/<name>`) resolve against the
      directory okg runs from and do not follow ARCHI_DATA_ROOT. Pass
      an absolute path (the quickstart uses
      `--archi-data-root "$ARCHI_DATA_ROOT/data"`) and keep it outside
      the deployment dir, which `okg install --force` deletes.

  - id: cmssw_map_path
    prompt: path to a reviewed, immutable CMSSW releases.map (frozen mode
      only; leave blank for the live fetch)
    type: path
    required: false
    default: ""
    description: |
      Only used by source-defaults/cmssw_releases_frozen.yaml.example,
      which pins the release catalog to bytes you have reviewed instead
      of fetching cms-bot live. Leave blank unless you enabled that file
      — the live default ignores this answer entirely.

  - id: cmssw_map_digest
    prompt: sha256:<64 hex> of that releases.map (frozen mode only)
    type: string
    required: false
    default: ""
    description: |
      The digest the reader verifies the file against before parsing a
      byte of it, as `sha256:` plus 64 lowercase hex characters:
      `sha256:$(shasum -a 256 <file> | cut -d' ' -f1)`.

      Blank does NOT mean "skip verification". Frozen mode with an empty
      digest is refused (`map_cache_digest must be sha256:<64 lowercase
      hex>`), so forgetting it fails loudly rather than quietly ingesting
      unverified bytes. Verify the digest independently of whoever handed
      you the file — a digest taken from the same source proves nothing.

  - id: twiki_eos_root
    prompt: directory holding your TWiki EOS dump (only used if you enable
      source-defaults/twiki_eos.yaml.example)
    type: string
    required: false
    default: data/twiki-snapshot
    description: |
      TWiki reaches this bundle from an EOS dump only; there is no live
      crawl and no anonymous web fallback. Point this at a directory of
      raw TWiki markup: one `<Topic>.txt` per topic, each including its
      `%META:` lines. Subdirectories are subwebs. Topics of the web named
      by `web_root` (CMS in the shipped file) sit directly in this
      directory; do not nest them under an extra `CMS/` folder or every
      page id is double-prefixed.

      A relative path (the default included) is read from the directory
      you run okg from, not from the deployment dir, and it does NOT
      follow `archi_data_root`: if you pass a non-default
      `--archi-data-root`, also pass `--twiki-eos-root` explicitly. Give
      an absolute path.

      Only used if you enabled source-defaults/twiki_eos.yaml.example by
      renaming it. The source is required: a missing or empty dump
      blocks the publish rather than shrinking the graph quietly. To
      scope the read, edit the renamed file: `seed_topics` and
      `max_depth` for a subtree, `physics_filter` for physics topics
      only, `page_index_path` to write the list of kept page ids.

  - id: github_repo_name
    prompt: short name for the GitHub repository (graph identity)
    type: string
    required: false
    default: github-repo
    description: |
      Names the repository inside the graph. Any stable slug; it does
      not have to match the GitHub name.

  - id: github_repo_url
    prompt: GitHub repository URL to ingest
    type: string
    required: false
    default: ""
    description: |
      The connector clones this itself and fast-forwards it on later
      runs — you never run `git clone` by hand. A private repository
      uses your own git credentials, so no token reaches the instance.

      Only used if you enabled source-defaults/github_repo.yaml.example
      by renaming it. Leaving this blank does NOT install without the
      source: a source with no URL fails admission with `checkout
      unavailable` and blocks the whole publish. Enable the file and
      answer this, or leave the file as an example.

  - id: gitlab_repo_name
    prompt: short name for the GitLab repository (graph identity)
    type: string
    required: false
    default: gitlab-repo
    description: |
      Names the repository inside the graph.

  - id: gitlab_repo_url
    prompt: GitLab repository URL to ingest
    type: string
    required: false
    default: ""
    description: |
      The connector clones this itself and fast-forwards it on later
      runs — you never run `git clone` by hand. A private repository
      uses your own git credentials, so no token reaches the instance.

      Only used if you enabled source-defaults/gitlab_repo.yaml.example
      by renaming it. Leaving this blank does NOT install without the
      source: a source with no URL fails admission with `checkout
      unavailable` and blocks the whole publish. Enable the file and
      answer this, or leave the file as an example.

  - id: code_extractors_dir
    prompt: directory holding extractors.yaml for the code-text sources
      (leave the default)
    type: string
    required: false
    default: ${deployment_dir}
    description: |
      Only used if you enabled source-defaults/code_text.yaml.example or
      code_text_gitlab.yaml.example. Those sources store the code itself
      (function bodies) and read their parser and chunk-size settings from
      the extractors.yaml this bundle installs in the deployment directory.

      Leave the default. It is the literal text ${deployment_dir}: the
      installer does not expand it, and okg replaces it with the
      deployment directory each time it reads the source registry, so the
      deployment can move. Give an absolute path only to use an
      extractors.yaml of your own.

  - id: chat_site_name
    prompt: name for the chat site
    type: string
    required: false
    default: Team knowledge chat
    description: |
      Shown as the site title and the assistant's display name.

  - id: chat_model
    prompt: model the chat should offer
    type: string
    required: false
    default: llama3.1:8b
    description: |
      One model name, as your provider spells it. For a local ollama use
      whatever `ollama list` shows. The provider itself is configured
      inside the chat app with your own key — it is never written here.

# References to sibling files within this bundle dir.
modules: modules.yaml
source_defaults: source-defaults/
invariants: invariants.yaml
deployment_defaults: deployment-defaults.yaml
skills: skills/
# The distribution's own HEP vocabulary, materialised into the instance
# before the first catalog load (okg#1367). Symlinks into python/archi/
# so there is one copy in the repo; packaging dereferences them, exactly
# as it already does for skills/. This is what removes the manual
# schema-copy step and with it the whole --no-publish interlude.
schemas: schemas/
# Installed at the deployment root, byte for byte. extractors.yaml holds the
# parsers and chunk sizes the optional code-text sources read
# (source-defaults/code_text.yaml.example); without one of those enabled
# nothing reads it.
files:
  - extractors.yaml
