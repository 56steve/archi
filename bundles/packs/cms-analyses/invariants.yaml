# Coverage for the subtypes this pack emits. It leaves with the pack.
invariants:
  - name: cms_analyses_coverage
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The physics vocabulary and entity sources must have live hubs and
      entities. Required live subtypes: physics_analysis_group,
      physics_object_group, physics_technique, physics_concept,
      physics_topic. Both sources declare their nodes in code, so a missing
      one means the source did not run or was dropped from the install.
    sql: |
      WITH required(subtype) AS (
        VALUES ('physics_analysis_group'), ('physics_object_group'), ('physics_technique'), ('physics_concept'), ('physics_topic')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
