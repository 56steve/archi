pact_version: 5
id: compops-data-links
title: Commit-to-ticket links, TWiki link URLs, and JIRA fields and typed links
tier: 2
why: 'A review of the CMS comp-ops graph (mitdbg/okg#3649) found three facts the sources already
  hold that never reach the graph as structure.


  1. A commit message that names a JIRA key makes no edge: the cms_jira_key linker route reads only
  document_chunk. 86 (commit, key) pairs in 18 repositories, 0 edges.


  2. strip_twiki writes a labelled link [[URL][label]] as its label alone, so a JIRA key that sits
  only in the URL never reaches chunk text. 766 page-ticket pairs in the comp-ops TWiki snapshot,
  278 in the graph.


  3. JiraIssueSource keeps issue links, sub-task parents, resolution, labels and components only as
  chunk text, and no JiraIssue attribute is filterable, so created and updated cannot be range-filtered
  or sorted.


  All three follow the standing rule that a consumer''s variant is an option, off by default. The
  commit route is the exception that needs no option: it adds an edge only where a deployment already
  ingests git commits AND JIRA issues, and its narrowing is optional when either subtype is missing.


  OUT OF SCOPE: a resolved date (the downloader never fetched resolutiondate; that needs a live JIRA
  refetch), label or component nodes, and lowercase keys in commit messages (the extractor pattern
  is case-sensitive and stays so).'
affected_code:
- python/archi/enrichment/defaults/linker_config.yaml
- python/archi/schemas/bridges/operations.yaml
- python/archi/schemas/bridges/sources.yaml
- python/archi/schemas/sources.yaml
- python/archi/sources/_twiki_parse.py
