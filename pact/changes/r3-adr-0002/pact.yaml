pact_version: 5
id: r3-adr-0002
title: 'ADR 0002: Archi 3.0, automating operations on a solid context layer'
tier: 2
why: The workshop discussion (22/10/2026) restated Archi's focus, automating operations, and
  reframed the rest as replaceable layers (agent, chat, KB, ingestion, MCPs) held together
  by Archi with sensible defaults. Automation needs a solid context layer underneath it. ADR
  0001 still describes one bundle, an archi_v3 branch that is no longer where work lands,
  and no setup story. ADR 0002 records the 3.0 decisions so every later PACT can cite them.
affected_code:
- docs/adr/0002-archi-3.0-release.md
- docs/adr/0001-archi-v3-program-spec.md
requirements:
- id: req.r3-adr-0002.adr
  statement: 'docs/adr/0002-archi-3.0-release.md records D1-D9 (release home, PyPI name archi-kb,
    composable packs and bundles, the five 3.0 bundles, MCP as the client surface, one-command
    setup, a thin CLI, Langfuse deferred, PACT+issues planning) D10-D13 (operations automation
    as the purpose, agents propose / mediators act, automations gated on measured context,
    3.0 stops at L2), the composition rules, the context-layer properties (§6) and the autonomy
    levels (§7.3), and is approved by a maintainer.


    Acceptance:

    - acc.r3-adr-0002.approved: a Pact-Approved trailer on the commit that merges the ADR.
    [evidence: manual]'
