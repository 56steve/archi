  head: d9d9ccbe3e8424bb47c3150f1ef37e540d33e99f
  at: '2026-10-27T12:43:23+00:00'
  note: 'acc.r3-auto-ticket-triage.fixture: on a real okg 0.2.0 worker (cluster-manager with servicenow, jira and
    ticket-triage, fixture caches, a fake Redmine/JIRA/ServiceNow API on a loopback port) the scanner reads the
    published queue, and the first read only sets a cursor per system (no backlog). Three arriving tickets
    (Redmine, JIRA from the jira pack, JIRA from the tickets pack''s generic reader) each become one signal
    and a shadow run whose proposal is a draft citing the ticket and its related tickets by node id; the
    incident carries the ticket key. Promoted (archi ops promote, a PACT approval), L1 drafts and sends
    nothing. L2 proposes assigning an unassigned ticket to Grace Hopper (2 related tickets agree); approved,
    the live tool archi.tools.tickets:assign_ticket re-checks the approval, assigns once and notes the
    escalation id and approver on the ticket. Rejected, timed out (and a late approval refused) and halted
    runs never reach the ticket system; L3 is refused at run start citing D13. Records published and read
    back; no traceback through archi code. Lab: 37 checks, all pass. In process (test_ticket_triage_loop.py)
    the same loop with the real tool and its own approval check: shadow, L1, L2 approve/reject/timeout, halt
    after approval, a tampered payload refused by the tool, L3 refused. Unit and loop tests 266 passed with the
    bundle, docs and plan tests. Full suite at this tree: 3598 passed, 28 skipped; a rerun had one failure,
    the load-sensitive anonymizer timing test. The runs used 38ef50a1, whose python, bundles and docs equal
    this head (the rebuilt history only added the decisions row digest). The live four-week shadows are
    req.r3-auto-ticket-triage.shadow and are not evidenced here.'
