requirements:
- id: req.r3-auto-ticket-triage.automation
  statement: 'The ticket-triage pack triggers on new or updated tickets (Redmine, JIRA, ServiceNow),
    retrieves related tickets, docs and precedents, and drafts a cited reply (L1) or proposes
    a status or assignment change (L2, approved escalation required). The ticket system''s
    status reflects the escalation ledger.


    Acceptance:

    - acc.r3-auto-ticket-triage.fixture: fixture queue yields cited drafts and gated status
    proposals. [evidence: executed_test]'
- id: req.r3-auto-ticket-triage.shadow
  statement: 'It runs in shadow at SubMIT (cluster-manager) for at least four weeks before
    the release, and a report gives agreement with operators, time-to-first-response and
    false-proposal rate. The comp-ops queue shadow is not part of 3.0 (decision 2026-10-27,
    board d380 Q6); the pack stays optional in cms-comp-ops. No promotion to live is required
    for 3.0; the v2 queue bots keep serving until it happens.


    Acceptance:

    - acc.r3-auto-ticket-triage.report: four-week SubMIT shadow report, published with the
    release. [evidence: manual]'
tasks:
