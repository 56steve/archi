pact_version: 5
id: r3-auto-ticket-triage
title: 'Reference automation: ticket triage (SubMIT, comp-ops)'
tier: 2
why: 'Ticket triage is the automation 3.0 focuses on. Ticket queues are the oldest Archi automation
  (v2''s Redmine, JIRA and Mattermost bots, ADR 0001 W8), and the clearest test of the loop:
  drafts need context and precedent, and status changes need approval. 3.0 ships it in shadow
  with a measured report; promotion to live, and with it retiring the v2 bots, is the 3.1
  goal. ADR 0002 §7.4, D10, D13.'
