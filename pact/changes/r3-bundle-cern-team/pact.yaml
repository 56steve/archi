pact_version: 5
id: r3-bundle-cern-team
title: cern-team bundle on packs, with a credential-free default
tier: 2
why: cern-team is the generic bundle every other CERN bundle extends. Its only default source
  is cmssw_releases, chosen because it needs no credential, which makes the generic CERN bundle
  CMS-specific. ADR 0002 §5.
affected_code:
- bundles/cern-team/
requirements:
- id: req.r3-bundle-cern-team.bundle
  statement: 'bundles/cern-team/bundle.yaml defaults to docsite and public indico, offers
    twiki, cds, jira, git-code, code-text and code-symbols as optional, and no longer includes
    cmssw-releases; a bare install publishes with no credential.


    Acceptance:

    - acc.r3-bundle-cern-team.bare: archi init --bundle cern-team with no answers publishes.
    [evidence: executed_test]

    - acc.r3-bundle-cern-team.smoke: its smoke eval passes. [evidence: executed_test]'
- id: req.r3-bundle-cern-team.migrate
  statement: 'Existing cern-team instances have a written route to the new layout (what changes
    in the registry, how to keep cmssw-releases).


    Acceptance:

    - acc.r3-bundle-cern-team.doc: migration note reviewed. [evidence: manual]'
tasks:
- id: task.r3-bundle-cern-team.rebuild
  requirement: req.r3-bundle-cern-team.bundle
  verification: 'Write bundle.yaml; retire the old profile.yaml.


    Test plan:

    - bundle CI job [evidence: executed_test]'
- id: task.r3-bundle-cern-team.migrate
  requirement: req.r3-bundle-cern-team.migrate
  verification: 'Write the migration note.


    Test plan:

    - review [evidence: manual]'
evidence:
- kind: manual
  requirement: req.r3-bundle-cern-team.migrate
  status: pass
  command: docs/cern-team-migration.md, reviewed by an independent agent review of the branch
  head: cd1e35af2b7e914c7e5444c6ba05292ef9172c3d
  at: '2026-10-26T01:52:20+00:00'
  note: 'acc.r3-bundle-cern-team.doc: docs/cern-team-migration.md gives existing cern-team instances a written
    route to the pack layout: what changes in the source registry (cmssw_releases leaves the defaults; docsite
    and indico become defaults, with docsite''s prepare step and indico''s default event), how to keep the
    CMSSW release catalog (archi add cmssw-releases), that archi add --no-okg skips prepare steps, that
    instances without an archi.lock have no in-place route, and that instances created before 2026-10-26
    kept their graph only in the container and should be re-initialised. The review found the commands
    correct and asked for the --no-okg and podman-compose caveats, both added.'
decisions: []
