  status: pass
  command: python -m pytest python/tests/tools python/tests/ops -q (fake runner; no scheduler command is ever run)
  head: 234014132038de4ff107557b846830930ffdf2e7
  at: '2026-10-26T16:03:19+00:00'
  note: 'acc.r3-bundle-cluster-manager.gated: the Slurm act tools (drain_node, resume_node, requeue_job) are L2
    mediators, declared idempotent, with explicit payload schemas. Called without an approved escalation, or with
    an expired, future, halted or superseded one (archi.ops.escalation.may_execute plus the halt check), or with
    a payload different from the one the approver saw (one fixed Action line in the escalation reason), each
    refuses and runs no command; a test drives both the runtime''s mediator step and a direct call. Reads
    (squeue, sinfo, condor_q, condor_status) have timeouts and capped output. Node and job ids are validated by
    full match. requeue records its idempotency mark only after a confirmed requeue; resume touches only nodes
    archi drained unless force is set; a timed-out act reports unknown. No real Slurm or HTCondor command was run.'
