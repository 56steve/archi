pact_version: 5
id: r3-bundle-cms-comp-ops
title: cms-comp-ops bundle; rebuild the comp-ops instance from it
tier: 2
why: ADR 0001 kept comp-ops an instance until a second ops team appeared. CRAB and WisDQM
  now reuse the same CMS catalogs and monitoring, so the shape recurs. The comp-ops instance
  (gitlab.cern.ch/archi/cms-compops) stays the standing validation target (ADR 0001 D10).
affected_code:
- bundles/cms-comp-ops/
- skills/
requirements:
- id: req.r3-bundle-cms-comp-ops.bundle
  statement: 'bundles/cms-comp-ops extends cern-team, defaults to cms-catalogs, cmssst and
    cmssw-releases, offers monit-live, dqm, hypernews and jira, and carries the comp-ops playbooks
    (rucio_*, site_profile, incident_root_cause, monitoring_condor_snapshot) in its packs,
    plus ops-record by default and the ticket-triage automation pack as optional.


    Acceptance:

    - acc.r3-bundle-cms-comp-ops.install: an install-and-publish test (test_pack_isolation)
    installs the bundle green with fixture caches, in place of a bundle CI job (board d380 Q7;
    the CI gate is deferred to #619 by d332). The lab smoke run Q7 pairs with it is moot here:
    under d380 Q6 this bundle has no smoke-eval set in 3.0. [evidence: executed_test]

    - acc.r3-bundle-cms-comp-ops.smoke: not in 3.0. The bundle ships no smoke-eval set in 3.0
    (board d380 Q6), so no smoke eval runs for it; this line records the exclusion and is not
    met by a run. [evidence: manual]'
- id: req.r3-bundle-cms-comp-ops.instance
  statement: 'The cms-compops instance is regenerated from `archi init --bundle cms-comp-ops`
    plus instance-local config, with the parity auditor green.


    Acceptance:

    - acc.r3-bundle-cms-comp-ops.parity: audit_a2rchi_source_parity.py --fail-on-non-parity
    green. [evidence: executed_test]'
tasks:
- id: task.r3-bundle-cms-comp-ops.bundle
  requirement: req.r3-bundle-cms-comp-ops.bundle
  verification: 'Write the bundle.


    Test plan:

    - python/tests/packs/test_pack_isolation.py (cms-comp-ops case) [evidence: executed_test]'
- id: task.r3-bundle-cms-comp-ops.playbooks
  requirement: req.r3-bundle-cms-comp-ops.bundle
  verification: 'Assign playbooks and triggers to packs.


    Test plan:

    - python/tests/test_skills.py [evidence: pytest]'
- id: task.r3-bundle-cms-comp-ops.instance
  requirement: req.r3-bundle-cms-comp-ops.instance
  verification: 'Rebuild the instance; run parity.


    Test plan:

    - parity run on the instance [evidence: executed_test]'
evidence:
- kind: executed_test
  requirement: req.r3-bundle-cms-comp-ops.bundle
  status: pass
  command: python -m pytest tests/test_bundle_cern_team.py tests/test_bundle_cms_comp_ops.py -q (from
    python/, submit76)
  head: 79c60bbbde118748c795b7cc636b339fbdcdb81d
  at: '2026-10-27T03:49:42+00:00'
  note: 'task.r3-bundle-cms-comp-ops.playbooks only: 22 passed, 9 of them in test_bundle_cms_comp_ops.py.
    The comp-ops playbooks render with their packs (rucio_command, rucio_dataset_hosting, site_profile
    and incident_root_cause from cms-catalogs; monitoring_condor_snapshot from monit-live), each with its
    library trigger; a playbook is absent when its pack is not selected; incident_root_cause is not in the
    generic ops-record pack. The pack entries are symlinks to the files in top-level skills/, which stay
    the single source. Not proven by this row: acc.r3-bundle-cms-comp-ops.install, .smoke or .parity.'
decisions:
- digest: sha256:0338685c79c09175409b872e92ae25f972abb6c926e523a74a3d30e3700ec88b
  reviewer: Jason Mohoney
  at: '2026-10-27'
  note: 'Board d380 Q6, Jason: "Record it; drop #748 from 3.0". The cms-comp-ops bundle has no
    smoke-eval set in 3.0 (Jason, 2026-10-27: "let''s exclude cms-comp ops from the bundle",
    read narrowly as excluding it from the eval work, not from the bundle catalog), so
    acc.r3-bundle-cms-comp-ops.smoke now records that exclusion. The four-week comp-ops
    shadow (#748) is out of 3.0. Nothing else in this PACT changes.'
- digest: sha256:0338685c79c09175409b872e92ae25f972abb6c926e523a74a3d30e3700ec88b
  reviewer: Jason Mohoney
  at: '2026-10-27'
  note: 'acc.r3-bundle-cms-comp-ops.install reworded (#724). Board d380 Q7, Jason: "Yes". A
    bundle CI job becomes an install-and-publish test (test_pack_isolation) plus a lab smoke
    run. No bundle CI job exists because board d332 deferred the CI gate on bundle changes to
    the #619 eval framework. The lab smoke run is moot for this bundle under d380 Q6, which
    leaves it no smoke-eval set in 3.0, so the install-and-publish test alone applies.'
