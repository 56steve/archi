pact_version: 5
id: r3-bundle-evals
title: Smoke evals per bundle, run against the instance MCP
tier: 2
why: 'A bundle that installs green can still answer nothing. Each bundle ships a small eval
  set so ''it works'' is a checked claim, and `archi eval` lets an operator run it. This
  is option A of board d332, chosen by Jason: a thin $0 smoke harness (a small tool-calling
  agent over the instance MCP, a local model, deterministic checks, no LLM judge, no paid
  call). The eval framework tracked in #619 REPLACES this harness. It is not built here: its
  question files and report format are kept so they can move across. The CI gate on bundle
  changes across all four bundles is deferred to #619, because a gate needs either a slow
  local model or a paid API model. The one exception is the nightly run Jason asked for, which
  runs `archi eval --bundle cern-team` with a small CPU model and does not gate on a score
  (see decisions). Out of scope: the context eval (r3-context-quality, retrieval recall@k with a
  raw-document baseline), which stays with #619.'
affected_code:
- python/archi/evaluation/
- python/archi/cli/evaluate.py
- python/tests/evaluation/
- bundles/*/eval/
- .github/workflows/nightly-e2e.yml
- docs/docs/operating/evals.md
- docs/docs/operating/commands.md
- docs/docs/operating/index.md
- docs/docs/context-layer.md
- docs/docs/reference/cli.md
- docs/mkdocs.yml
- python/archi/cli/__init__.py
- python/archi/bundles/cli.py
- python/tests/test_bundle_cern_team.py
requirements:
- id: req.r3-bundle-evals.harness
  statement: '`archi eval [--bundle X] [--instance DIR] [--model M] [--model-url URL] [--out DIR]`
    runs the bundle''s smoke set against the instance MCP endpoint (streamable HTTP, bearer
    token from the instance .env) and writes report.md and report.json. The model is a local
    one behind an OpenAI-compatible endpoint (Ollama); a remote endpoint is refused unless
    asked for, so a run costs nothing. The agent is one small tool-calling loop; the checks
    are deterministic (cited node ids, subtypes or sources, required strings), with no LLM
    judge. If the agent has zero MCP tools, the run fails as execution_failed. The report
    gives, per question, pass, fail or execution_failed, the cited ids, tool calls, tokens
    and wall time, and the run''s model, tools and prompt hash. The command exits non-zero
    below the bundle''s pass threshold. The harness is a stop-gap: the #619 framework
    replaces it.


    Acceptance:

    - acc.r3-bundle-evals.run: an eval run on a scratch instance on submit76 with a local
    model produces report.md and report.json. [evidence: executed_test]'
- id: req.r3-bundle-evals.ci
  statement: 'Each shipped bundle with a smoke set (cern-team and cms-physics now; cms-comp-ops
    and cluster-manager when their sets are written) has at least 10 questions answerable
    from its fixture corpus. Each question lists the evidence it must cite (node ids, subtypes
    or sources) and any strings the answer must hold, so no LLM judge is needed. A local-model
    run passes at least the bundle''s pass threshold, which starts at 7 of 10. The nightly
    workflow runs the cern-team set with a small CPU model as a report. A CI gate on bundle
    changes across all four bundles is DEFERRED to the #619 framework.


    Acceptance:

    - acc.r3-bundle-evals.sets: cern-team and cms-physics each ship a smoke set of at least
    10 questions and a local-model run on the fixture instance passes at least the threshold.
    [evidence: executed_test]

    - acc.r3-bundle-evals.nightly: the nightly workflow runs `archi eval --bundle cern-team`
    after the cited-answer step. [evidence: executed_test]'
tasks:
