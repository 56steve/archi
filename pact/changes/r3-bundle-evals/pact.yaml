pact_version: 5
id: r3-bundle-evals
title: Smoke evals per bundle, run against the instance MCP
tier: 2
why: 'A bundle that installs green can still answer nothing. Each bundle ships a small eval
  set so ''it works'' is a checked claim, and `archi eval` lets an operator run it. This
  is option A of board d332, chosen by Jason: a thin $0 smoke harness (a small tool-calling
  agent over the instance MCP, a local model, deterministic checks, no LLM judge, no paid
  call). The eval framework tracked in #619 REPLACES this harness. It is not built here: its
  question files and report format are kept so they can move across. The CI gate on bundle
  changes across all four bundles is deferred to #619, because a gate needs either a slow
  local model or a paid API model. The one exception is the nightly run Jason asked for, which
  runs `archi eval --bundle cern-team` with a small CPU model and does not gate on a score
  (see decisions). Out of scope: the context eval (r3-context-quality, retrieval recall@k with a
  raw-document baseline), which stays with #619.'
