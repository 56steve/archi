    files and playbooks equal what okg builds from the hand-written profile. Full suite 2025
    passed, 1 skipped.'
- kind: executed_test
  requirement: req.r3-bundle-format.packaging
  status: pass
  command: python -m pytest python/tests/bundles/test_packaging.py -q
  head: ee7c6802cfedeeab7d2f9821ca89a3d8ec954338
