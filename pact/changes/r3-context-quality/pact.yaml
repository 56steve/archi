- docs/docs/context-layer.md
- docs/docs/migration-from-v2.md
requirements:
- id: req.r3-context-quality.freshness
  statement: 'Every context pack declares max_staleness per source; archi doctor reports each
    source''s age (from okg watermarks) against it, and --json exposes it for automations
    and agents.


    Acceptance:

    - acc.r3-context-quality.report: doctor flags a fixture source older than its SLO. [evidence:
    pytest]'
- id: req.r3-context-quality.linking
  statement: 'Each pack declares a link-coverage target for the identifiers it carries (sites,
    datasets, runs, releases, tickets, analysis ids); an invariant checks it per generation.


    Acceptance:

    - acc.r3-context-quality.coverage: a fixture corpus with broken links fails the invariant.
    [evidence: pytest]'
- id: req.r3-context-quality.context-eval
  statement: '`archi eval --context` scores retrieval separately from answers: operator questions
    with gold evidence ids, recall@k of the gold evidence, and a raw-document baseline arm.
    The comp-ops operator top-50 is the first set.


    Acceptance:

    - acc.r3-context-quality.run: context eval on the comp-ops instance produces a report
    with the baseline arm. [evidence: executed_test]

    - acc.r3-context-quality.raw-arm: a bash agent over the files the graph was built from,
    scored on gold-evidence recall next to a graph-tool agent on the same model, caps and scorer,
    with a spend ledger and a cap. [evidence: executed_test]

    - acc.r3-context-quality.raw-arm-safety: fixture tests show the sandbox has no network, cannot
    write to the corpus and holds no credential; the arm refuses to start without a cap, a corpus
    digest and a resolved gold map. [evidence: pytest]'
- id: req.r3-context-quality.gate
  statement: 'A context gate (sources, max staleness, minimum context-eval score, required
    invariants) can be evaluated against the current generation and returns pass, or fail
    with the failing checks named.


    Acceptance:

    - acc.r3-context-quality.gate: gate tests over passing and failing fixtures. [evidence:
    pytest]'
