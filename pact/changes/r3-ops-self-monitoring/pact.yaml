  at: '2026-10-27T02:58:52+00:00'
  note: 'Run on submit76 from a clean clone of the head, with the okg 0.2.0 wheel and Python 3.12. Eval trends
    are now read. The instance-health eval signal reads every report.json that archi eval wrote under
    <data root>/eval/ (or eval.reports_dir), for the bundles archi.yaml lists, and raises one issue per bundle
    (eval/<bundle>) when the latest run ended execution_failed (reported as a failed health signal, not a low
    score), passed fewer questions than the bundle threshold, or scored more than eval.min_drop (default 0.1)
    below the mean of up to three earlier runs of the same model and question set. Earlier runs in which the
    run or any question ended execution_failed are left out of that mean, and such questions in the latest run
    are named in the issue. A newest run older than eval.max_age_days (default 14) is a note, not an issue. No
    report: the signal is still skipped and said so. Proven with fixture report.json files built from
    archi.evaluation.runner.Report.to_dict (no eval runs): threshold, drop, margin setting, execution_failed
    runs and questions, grown question set and changed prompt hash, baseline window, model and bundle
    separation, unlisted bundles, the age note, duplicate, foreign and malformed reports, the data-root and
    archi.yaml defaults, and a proposal from a real archi.yaml that validates against the pack schema. Health
    tests 141 passed; full suite 3481 passed, 27 skipped. A context-eval report, once #698 lands, is not read.'
